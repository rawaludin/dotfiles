# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -sg escape-time 0

# increase scrollback buffer size
set -g history-limit 50000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# refresh 'status-left' and 'status-right' more often
set -g status-interval 1

# activate focus events so FocusLost and FocusGained in vim working
set -g focus-events on

# Set prefix to Ctrl-t
set -g prefix C-t
unbind C-b

# Allow mouse
set -g mouse on

# Native scroll
# Activate copy mode when scroll up
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
# Exit copy mode when at bottom scroll
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Windows & pane index start from 1
set -g base-index 1
set -g pane-base-index 1

# Refresh config by prefix+r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# clear history
bind-key -n C-l if-shell -F '#{alternate_on}' 'send-keys C-l' 'send-keys -R C-l; clear-history'

# vim like window management
# prefix+v => vertical split, prefix+s horizontal split
unbind s
bind v split-window -h
bind s split-window -v

# Use vim keybindings in copy mode
setw -g mode-keys vi

# new binding for choose session
# bind / choose-session
bind O kill-session -a \; display "Session cleared!"
# fuzzy search session
bind / new-window '~/.tmux/session-finder/session-finder.bash finder'

# jump to last session
bind C-e switch-client -l
bind e switch-client -l

# prefix+Esc or ^c to start copy mode
unbind [
bind Escape copy-mode
bind C-c copy-mode

# vim style paste (prefix+p)
unbind p
bind p paste-buffer

# Setup 'v' to begin selection in copy mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection

# vim style yank (y from copy mode)
# Pipe into pbcopy so the yank reaches the macOS clipboard. This is the
# reliable path on macOS: tmux-yank's own copy-pipe-and-cancel bindings
# depend on the plugin being present, and Terminal.app has no OSC 52 support,
# so forwarding alone cannot work there.
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# make true color work
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# enable 24bit color support
# set-option -ga terminal-overrides ",xterm-256color-italic:Tc"

# Make custom vim binding to "buble" text in normal with with (C-up) / (C-down)
# working again
set-window-option -g xterm-keys on

# Enable extended keys (needed for modified Enter keys, e.g. Shift+Enter)
set -g extended-keys on
set -g extended-keys-format csi-u

# turn off automatic rename window
set-window-option -g allow-rename off

# setup theme
if-shell "test -f ~/.tmux-theme.conf" "source ~/.tmux-theme.conf"

# hjkl pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# forgive still press ctrl when moving pane
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R
# easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window
bind p previous-window
bind n next-window

# new window and pane use current pane path
bind c new-window -c '#{pane_current_path}'
bind s split-window -v -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'

# Fix MacOS clipboard integration
# See https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard
set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Accept and forward OSC 52 clipboard writes from applications.
#
# This is the load-bearing setting. tmux's default since 3.2 is `external`,
# which neither stores the app's OSC 52 in a tmux buffer nor forwards it, so
# TUI apps that copy via OSC 52 (opencode among them) silently do nothing.
# Verified on tmux 3.5a by capturing every byte tmux writes to a client:
#   external -> not forwarded, no buffer
#   on      -> forwarded AND stored in a tmux buffer
#
# `on` makes the clipboard work in iTerm2/Ghostkitty/kitty/WezTerm/Alacritty/
# Warp. Terminal.app is a separate gap - it implements no OSC 52 at all - so
# for that terminal the copy-mode yank bindings piping to pbcopy above are
# what actually land text on the system clipboard.
set -g set-clipboard on

# Allow tmux DCS passthrough (\x1BPtmux;...\x1B\\) for apps that wrap OSC 52.
#
# opencode wraps its OSC 52 copy in DCS passthrough when $TMUX is set
# (upstream issues #19982/#25253, PR #30472). With the tmux default
# `allow-passthrough off`, tmux silently drops that sequence, so opencode shows
# "copied to clipboard" but nothing reaches the outer terminal. Raw OSC 52
# (what `set-clipboard on` forwards) keeps working either way, so enabling
# passthrough covers both old (wrapped) and new (raw) opencode builds.
set -g allow-passthrough on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-urlview'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux-plugins/"
run '~/.tmux-plugins/tpm/tpm'

# use default shell
set-option -g default-shell $SHELL
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
